# Builds the wheels and the source distribution with the GUI bundle inside, and publishes them to
# PyPI through trusted publishing when a v* tag is pushed. A pull request that changes this file,
# or a manual run, builds and checks everything without publishing.
name: Release

on:
  push:
    tags: ["v*"]
  pull_request:
    paths: [.github/workflows/release.yml]
  workflow_dispatch:

permissions:
  contents: read

# Actions are pinned by commit SHA so a moved tag cannot change what runs; Dependabot bumps them.
# maturin-action reads the Rust version from rust-toolchain.toml.
jobs:
  gui:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check the tag matches the package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(grep -m1 '^version = ' pyproject.toml | cut -d'"' -f2)
          test "${GITHUB_REF_NAME#v}" = "$version" || { echo "tag $GITHUB_REF_NAME, package $version"; exit 1; }
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: wasm-pack,cargo-about
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      # The engine module and the model module.
      - run: npm run wasm
        working-directory: web
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
      # After the build, which empties the directory: the licences of the Rust crates compiled in.
      - run: cargo about generate --workspace about.hbs -o src/plotline/web/THIRD-PARTY-LICENSES.txt
      # A wheel without the bundle would install a `plotline gui` that cannot start.
      - run: test -f src/plotline/web/index.html && test -f src/plotline/web/preact-LICENSE.txt && test -f src/plotline/web/lucide-preact-LICENSE.txt && test -s src/plotline/web/THIRD-PARTY-LICENSES.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gui
          path: src/plotline/web
          if-no-files-found: error

  # One abi3 wheel per platform serves Python 3.11 and later. Linux wheels are built in the
  # manylinux containers, so they install on older distributions such as a Raspberry Pi's.
  # shortcut: no musllinux or Windows on Arm wheels; those users build from the sdist, which needs Rust.
  wheels:
    needs: gui
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64 }
          - { os: ubuntu-24.04-arm, target: aarch64 }
          - { os: windows-latest, target: x64 }
          - { os: macos-latest, target: universal2-apple-darwin }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: gui
          path: src/plotline/web
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          target: ${{ matrix.target }}
          manylinux: auto
          args: --release --out dist
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.11"
      - name: Check the wheel installs, runs and carries the GUI
        shell: bash
        run: |
          whl=$(ls dist/*.whl)
          uv run --isolated --no-project --with "$whl" plotline styles
          uv run --isolated --no-project --with "$whl" python -c "from importlib import resources; assert (resources.files('plotline') / 'web' / 'index.html').is_file()"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ matrix.os }}-${{ matrix.target }}
          path: dist
          if-no-files-found: error

  sdist:
    needs: gui
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: gui
          path: src/plotline/web
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: sdist
          args: --out dist
      - run: tar -tzf dist/*.tar.gz | grep -q 'src/plotline/web/index.html$'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-sdist
          path: dist
          if-no-files-found: error

  # PyPI trusts this workflow and environment through a trusted publisher, so no token is stored.
  publish:
    needs: [wheels, sdist]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
