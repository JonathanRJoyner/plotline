name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push to a pull request cancels its older run; runs on main always finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Actions are pinned by commit SHA so a moved tag cannot change what runs; Dependabot bumps them.
# The Rust toolchain, its components and the wasm target come from rust-toolchain.toml.
jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: ${{ matrix.python }}
      # uv sync builds the Rust extension (crates/py) with maturin.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src
      - run: uv run pytest -q
      - run: uv run python scripts/check_licenses.py

  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked -p plotline-core
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check licenses

  wasm:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: wasm-pack
      - run: wasm-pack test --node
        working-directory: crates/wasm
      - run: wasm-pack build --release --target web --out-dir ../../web/pkg
        working-directory: crates/wasm
      - name: Check the .wasm size
        run: |
          size=$(stat -c %s web/pkg/plotline_wasm_bg.wasm)
          echo "plotline_wasm_bg.wasm is $size bytes"
          test "$size" -le 2000000

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: wasm-pack
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm run wasm
        working-directory: web
      - run: npm ci
        working-directory: web
      - run: npm run check
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: test -f src/plotline/web/index.html && test -f src/plotline/web/preact-LICENSE.txt && test -f src/plotline/web/lucide-preact-LICENSE.txt
      # The e2e job tests this bundle rather than building its own.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bundle
          path: src/plotline/web
          if-no-files-found: error
          retention-days: 1

  # The browser flows in web/e2e, one per GUI feature, in Chromium against the web job's bundle.
  e2e:
    needs: web
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bundle
          path: src/plotline/web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: npm run e2e
        working-directory: web
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: web/playwright-report
          retention-days: 14

  # Draws the regression gallery and checks its stats against tests/snapshots/gallery-stats.json,
  # so a change that moves a drawing shows in review as a diff of numbers. On a pull request the
  # gallery is drawn on the base branch too, and the artifact outlines the cells that changed.
  gallery:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BASE: ${{ github.event.pull_request.base.sha }}
      SNAPSHOT: tests/snapshots/gallery-stats.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # for the base branch
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Draw the gallery on the base branch
        if: github.event_name == 'pull_request'
        env:
          # Its own target directory: cargo hashes a workspace crate without its path, so in a
          # shared one the branch's build would take the base's gallery binary as up to date.
          CARGO_TARGET_DIR: ${{ runner.temp }}/base-target
        run: |
          git worktree add --detach "$RUNNER_TEMP/base" "$BASE"
          cd "$RUNNER_TEMP/base"
          rustup toolchain install
          cargo run --release --locked -p plotline-core --example gallery -- "$RUNNER_TEMP/gallery-base"
      - name: Draw the gallery
        run: |
          baseline=()
          if [ -d "$RUNNER_TEMP/gallery-base" ]; then baseline=(--baseline "$RUNNER_TEMP/gallery-base"); fi
          cargo run --release --locked -p plotline-core --example gallery -- "$RUNNER_TEMP/gallery" "${baseline[@]}" --snapshot "$SNAPSHOT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gallery
          path: ${{ runner.temp }}/gallery
          retention-days: 14
      - name: Compare the stats with the snapshot
        run: |
          rows() { grep '^[-+] ' || echo "(none)"; }
          if [ -n "$BASE" ]; then
            {
              echo "## Drawing stats"
              echo "The cells whose stats differ from the base branch. The gallery artifact shows their pictures."
              echo '```diff'; git diff -U0 "$BASE" -- "$SNAPSHOT" | rows; echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          if ! git diff --quiet -- "$SNAPSHOT"; then
            {
              echo "## The stats snapshot is out of date"
              echo "These cells moved, but $SNAPSHOT was not updated. If the change is meant, regenerate it with"
              echo '`cargo run --release -p plotline-core --example gallery -- target/gallery --snapshot tests/snapshots/gallery-stats.json`'
              echo "and commit it."
              echo '```diff'; git diff -U0 -- "$SNAPSHOT" | rows; echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error file=$SNAPSHOT::The drawings' stats moved, but the snapshot was not updated. The job summary lists the cells; CONTRIBUTING.md says how to regenerate it."
            exit 1
          fi
