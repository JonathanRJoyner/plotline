[package]
name = "plotline-py"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
name = "_core"
crate-type = ["cdylib"]

[dependencies]
# `extension-module` is switched on by maturin (`[tool.maturin] features`), so that
# `cargo test --workspace` links natively without Python.
pyo3 = { version = "0.29.3", features = ["abi3-py311"] }
numpy = "0.29.0"
serde = "1"
serde_json = "1"
plotline-core = { path = "../core" }
