[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.2.0-dev0"
edition = "2021"
license = "MIT"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

# The engine's tests run whole styles on real-sized rasters, which unoptimised code makes slow.
[profile.test]
opt-level = 1

# Image decoding, PNG encoding and JSON run once per image, export or command, not in a run's
# loop, so they are built for size: 41 KB off the WebAssembly module, with runs unchanged and
# decoding within a few percent (brief §14, "Wasm size limit"). tiny-skia stays at 3, where it is
# both smaller and faster.
[profile.release.package.zune-jpeg]
opt-level = "s"
[profile.release.package.zune-core]
opt-level = "s"
[profile.release.package.image]
opt-level = "s"
[profile.release.package.image-webp]
opt-level = "s"
[profile.release.package.png]
opt-level = "s"
[profile.release.package.fdeflate]
opt-level = "s"
[profile.release.package.miniz_oxide]
opt-level = "s"
[profile.release.package.flate2]
opt-level = "s"
[profile.release.package.serde_json]
opt-level = "s"
[profile.release.package.schemars]
opt-level = "s"

# The model module (crates/models, its `web` feature) is built for size from the crates only it
# uses: 13.2 MB at opt-level 3, 8.3 MB like this, and as fast, since the time goes to the
# tract-linalg kernels, which stay at 3 (spec 2026-10-16-learned-line-models, "Measurements").
# Every other crate of that module adds under 30 KB together, so they are left alone. None of
# these crates is in the engine module.
[profile.release.package.plotline-models]
opt-level = "s"
[profile.release.package.tract-core]
opt-level = "s"
[profile.release.package.tract-data]
opt-level = "s"
[profile.release.package.tract-extra]
opt-level = "s"
[profile.release.package.tract-hir]
opt-level = "s"
[profile.release.package.tract-nnef]
opt-level = "s"
[profile.release.package.tract-onnx]
opt-level = "s"
[profile.release.package.tract-onnx-opl]
opt-level = "s"
[profile.release.package.ndarray]
opt-level = "s"
[profile.release.package.rustfft]
opt-level = "s"
[profile.release.package.prost]
opt-level = "s"
[profile.release.package.nom]
opt-level = "s"
