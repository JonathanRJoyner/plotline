[project]
name = "plotline"
version = "0.1.0"
description = "Turn images into drawings for pen plotters."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "click>=8.2",
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Environment :: Console",
  "Environment :: Web Environment",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Rust",
  "Topic :: Artistic Software",
  "Topic :: Multimedia :: Graphics :: Graphics Conversion",
]

[project.urls]
Homepage = "https://jonathanrjoyner.github.io/plotline/"
Source = "https://github.com/JonathanRJoyner/plotline"
Issues = "https://github.com/JonathanRJoyner/plotline/issues"

[project.optional-dependencies]
mcp = ["mcp>=2.3,<3"]

[project.scripts]
plotline = "plotline.cli.main:main"

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6", "mypy>=1.11", "mcp>=2.3,<3"]

[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[tool.maturin]
python-source = "src"
module-name = "plotline._core"
manifest-path = "crates/py/Cargo.toml"
features = ["pyo3/extension-module"]
include = ["src/plotline/web/**/*"]

[tool.uv]
# Rebuild the extension when the Rust sources change, not only when pyproject.toml does.
cache-keys = [
  { file = "pyproject.toml" },
  { file = "Cargo.toml" },
  { file = "Cargo.lock" },
  { file = "crates/**/Cargo.toml" },
  { file = "crates/**/*.rs" },
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
module = ["plotline.session", "plotline.types"]
check_untyped_defs = true
disallow_any_generics = true
disallow_incomplete_defs = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_decorators = true
disallow_untyped_defs = true
extra_checks = true
implicit_reexport = false
strict_equality = true
warn_return_any = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
# A test still running after two minutes dumps every thread's stack, so a hang names itself.
faulthandler_timeout = 120
