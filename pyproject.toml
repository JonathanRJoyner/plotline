[project]
name = "plotline"
version = "0.1.0.dev0"
description = "Turn images into drawings for pen plotters."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "click>=8.2",
]

[dependency-groups]
# scipy, pillow and pydantic serve only the old Python engine under src/plotline/core, which
# Task 17 deletes; they stay here until then so its tests keep running.
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
  "mypy>=1.11",
  "scipy>=1.11",
  "pillow>=10.1",
  "pydantic>=2.6",
]

[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[tool.maturin]
python-source = "src"
module-name = "plotline._core"
manifest-path = "crates/py/Cargo.toml"
features = ["pyo3/extension-module"]

[tool.uv]
# Rebuild the extension when the Rust sources change, not only when pyproject.toml does.
cache-keys = [
  { file = "pyproject.toml" },
  { file = "Cargo.toml" },
  { file = "Cargo.lock" },
  { file = "crates/**/Cargo.toml" },
  { file = "crates/**/*.rs" },
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
module = "plotline.core.*"
check_untyped_defs = true
disallow_any_generics = true
disallow_incomplete_defs = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_decorators = true
disallow_untyped_defs = true
extra_checks = true
implicit_reexport = false
strict_equality = true
warn_return_any = true

[[tool.mypy.overrides]]
module = ["scipy", "scipy.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
